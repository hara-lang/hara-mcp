name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Report complete dependency audit
        run: npm audit --json || true
      - name: Reject production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format new host-socket files
        run: npx prettier --write src/host-socket-protocol.ts test/host-socket-protocol.test.ts
      - name: Upload formatted host-socket files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-host-socket-files
          path: |
            src/host-socket-protocol.ts
            test/host-socket-protocol.test.ts
          if-no-files-found: error
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
