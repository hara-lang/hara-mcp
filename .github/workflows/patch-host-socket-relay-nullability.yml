name: Patch host-socket relay nullability

on:
  push:
    branches:
      - agent/phase-3-host-socket-relay

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the exact nullability correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/host-socket-relay.ts')
          source = path.read_text()
          old = "      nextActive.cancel.acknowledged = true;\n"
          new = """      nextActive.cancel = {
                ...active.cancel,
                acknowledged: true
              };
          """
          if old not in source:
              print('exact correction is already present')
          else:
              path.write_text(source.replace(old, new, 1))
          PY
      - name: Install locked formatting toolchain
        run: npm ci --ignore-scripts
      - name: Format the corrected source
        run: npx prettier --write src/host-socket-relay.ts
      - name: Commit the correction when needed
        run: |
          if git diff --quiet -- src/host-socket-relay.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host-socket-relay.ts
          git commit -m "Fix hosted relay cancel acknowledgement narrowing"
          git push
